<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Tetris</h1>
    <div class="stats">
      <p class="stat">Score: <span id="score">0</span></p>
      <p class="stat">Lines: <span id="lines">0</span></p>
    </div>
    <canvas id="game" width="300" height="600"></canvas>
    <p class="hint">← → move · ↑ rotate · ↓ drop · R restart</p>
  </main>
  <script src="game.js"></script>
</body>
</html>
